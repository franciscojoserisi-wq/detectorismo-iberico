<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aportar hallazgo | Detectorismo Ibérico</title><link rel="stylesheet" href="css/estilos.css"></head><body><nav><a href="index.html">Inicio</a><a href="catalogo.html">Catálogo</a><a href="admin/index.html">Administrador</a></nav><main><section class="paper"><h1>Aportar un hallazgo</h1><p>El envío quedará pendiente de revisión. Para proteger el patrimonio, no introduzcas aquí coordenadas exactas ni información de lugares arqueológicos sensibles.</p><form id="form"><div class="formgrid"><label>Referencia (opcional)<input name="ref" placeholder="Se asignará automáticamente"></label><label>Tipo / periodo<input required name="tipo" placeholder="Ej. denario ibérico"></label><label>Municipio<input required name="municipio"></label><label>Provincia<input required name="provincia"></label><label>Diámetro (mm)<input name="diametro" type="number" step="0.01"></label><label>Peso (g)<input name="peso" type="number" step="0.01"></label><label>Nombre o apodo<input name="autor" placeholder="También puedes escribir ANÓNIMO"></label><label>Posible ceca<input name="ceca" placeholder="Si tienes una propuesta"></label></div><label>Descripción y observaciones<textarea name="descripcion" placeholder="Leyendas, iconografía, conservación, contexto, dudas..."></textarea></label><label>Enlace a fotografías (opcional)<input name="fotos" placeholder="En una futura versión podrás subirlas directamente"></label><label class="check"><input required type="checkbox"> Declaro que los datos aportados son sinceros según mis conocimientos y que respetaré la legislación aplicable.</label><button class="btn" type="submit">ENVIAR PARA REVISIÓN</button></form><p id="msg"></p></section></main><script src="js/participar.js"></script></body></html>
